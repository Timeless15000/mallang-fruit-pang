<body>
<canvas id="c"></canvas>
<div id="ui">
  <section id="home" class="screen show">
    <div class="topbar"><div class="gold"><i class="coin"></i><b id="hGold">0</b></div><button id="snd" class="icon-btn" aria-label="소리"></button></div>
    <div class="title">
      <div class="kicker">감염 확산 D+7 · 서울 전역 통제</div>
      <h1>서울 봉쇄</h1>
      <p class="tag">버텨라. 쓸어버려라. 살아서 나가라.</p>
    </div>
    <div class="chap">
      <button class="arrow" id="chPrev" aria-label="이전"></button>
      <div class="chcard" id="chCard"></div>
      <button class="arrow r" id="chNext" aria-label="다음"></button>
    </div>
    <button id="go" class="btn primary"><span>출격</span></button>
    <div class="row2"><button id="shopBtn" class="btn ghost"><span>강화</span><small>골드로 영구 강화</small></button></div>
    <div class="ver" id="ver"></div>
  </section>
  <section id="shop" class="screen panel">
    <div class="phead"><button class="icon-btn back" data-go="home" aria-label="뒤로"></button><h2>강화</h2><div class="gold"><i class="coin"></i><b id="sGold">0</b></div></div>
    <div id="ulist" class="ulist"></div>
  </section>
  <section id="hud" class="screen">
    <div class="xp"><i id="xpBar"></i></div>
    <div class="hrow">
      <div class="lv" id="lvT">Lv 1</div>
      <div class="time" id="timeT">00:00</div>
      <button id="pauseBtn" class="icon-btn sm" aria-label="일시정지"></button>
    </div>
    <div class="hrow2"><span class="kills" id="killT">0</span><span class="g"><i class="coin"></i><b id="goldT">0</b></span></div>
    <div id="bossBar" class="boss"><span id="bossName">거대 변이체</span><div class="bar"><i id="bossHp"></i></div></div>
    <div id="banner" class="banner"><b id="banT"></b><span id="banS"></span></div>
    <div id="chestT" class="chestT"></div>
    <div id="hint" class="hint">화면 아무 곳이나 눌러 끌면 이동</div>
  </section>
  <section id="lvl" class="screen lvl">
    <div class="lvhead"><div class="kicker">LEVEL UP</div><h2 id="lvNum">레벨 2</h2><p class="muted">하나를 골라라. 놈들은 기다려주지 않는다.</p></div>
    <div id="cards" class="cards"></div>
    <div id="build" class="build"></div>
  </section>
  <section id="pause" class="screen modal">
    <div class="card"><h2>일시정지</h2><div id="pBuild" class="pbuild"></div>
      <button id="resume" class="btn primary"><span>계속</span></button><button id="giveup" class="btn ghost"><span>작전 포기</span></button></div>
  </section>
  <section id="result" class="screen modal">
    <div class="card">
      <div class="kicker" id="rKick">CHAPTER 1</div>
      <h2 id="rTitle">생존 실패</h2><p class="muted" id="rSub"></p>
      <div class="stats">
        <div><span>생존 시간</span><b id="rTime">00:00</b></div><div><span>처치</span><b id="rKills">0</b></div>
        <div><span>레벨</span><b id="rLv">1</b></div><div><span>획득 골드</span><b id="rGold">0</b></div>
      </div>
      <div id="rBuild" class="pbuild"></div>
      <button id="again" class="btn primary"><span>다시 출격</span></button>
      <div class="two"><button id="rShop" class="btn ghost"><span>강화</span></button><button id="rHome" class="btn ghost"><span>홈</span></button></div>
    </div>
  </section>
</div>
</body>
