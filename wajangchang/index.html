  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <div id="hearts"></div>
        <div class="mid"><div id="score">0</div></div>
        <div class="right"><div id="coins" class="pill">🪙 <span>0</span></div><button id="mute" class="icon" aria-label="소리">🔊</button></div>
      </div>
      <div id="xpRow"><b id="lvl">Lv.1</b><div id="xpBar"><div></div></div></div>
      <div id="feverRow"><span>FEVER</span><div id="feverBar"><div></div></div></div>
      <div id="bossBar"><div></div><i style="left:33%"></i><i style="left:66%"></i><span id="bossName">👾 대왕 문어 UFO</span></div>
      <div id="combo"><b>0</b><span>파괴 콤보</span></div>
    </div>
    <button id="bombBtn" aria-label="메가 폭탄"><span>💣</span><i id="bombPct">0%</i></button>
    <div id="banner"></div>
    <div id="toast"></div>

    <div id="levelup" class="panel lv">
      <div class="lvTitle">⬆️ 레벨 업! <small>무기를 골라요</small></div>
      <div id="cards"></div>
    </div>
    <div id="revive" class="panel lv">
      <div class="card">
        <div class="overTitle">💔 격추 직전!</div>
        <p class="sub">한 판에 딱 한 번, 무료 부활!</p>
        <button id="reviveBtn" class="big">💖 부활하기 <span id="reviveT">4</span></button>
        <button id="giveUpBtn" class="chip" style="margin-top:10px">그냥 끝내기</button>
      </div>
    </div>

    <div id="home" class="screen show">
      <div class="logo"><span class="l1">와장창</span><span class="l2">대작전</span></div>
      <p class="pitch">손가락 하나로 <b>전부 부숴라!</b><br />무기가 폭주하는 파괴 쾌감 슈팅</p>
      <p class="bestline">최고 기록 <b id="homeBest">0</b>점</p>
      <div class="tapHint">👆 화면을 눌러 출격!</div>
      <div class="homeBtns">
        <button id="upBtn" class="chip">🔧 업그레이드</button>
        <button id="missionBtn" class="chip">🎯 오늘의 미션 <i id="missionBadge"></i></button>
      </div>
      <p class="how">드래그 이동 · 자동 발사 · 레벨업 무기 선택</p>
      <div id="version"></div>
    </div>

    <div id="over" class="screen">
      <div class="card">
        <div id="overTitle" class="overTitle">펑!</div>
        <div class="bigScore" id="overScore">0</div>
        <div id="overBest" class="sub"></div>
        <div id="overNear" class="near"></div>
        <div class="earn"><span id="overCoins">+0</span> 🪙 <small id="overStats"></small></div>
        <div id="overMissions"></div>
        <button id="againBtn" class="big">한 판 더!</button>
        <div class="row">
          <button id="overHome" class="chip">🏠 홈</button>
          <button id="overUp" class="chip">🔧 업그레이드</button>
        </div>
        <div class="tapHint small">빈 곳을 탭해도 바로 다시 시작!</div>
      </div>
    </div>

    <div id="upgrades" class="panel">
      <div class="card wide">
        <h2>🔧 업그레이드</h2>
        <p class="sub">부숴서 모은 코인으로 영구 강화! <b class="pill small">🪙 <span id="upCoins">0</span></b></p>
        <div id="upList"></div>
        <button class="big closeBtn" data-close="upgrades">닫기</button>
      </div>
    </div>
    <div id="missions" class="panel">
      <div class="card wide">
        <h2>🎯 오늘의 미션</h2>
        <p class="sub">매일 자정에 새로운 미션!</p>
        <div id="missionList"></div>
        <button class="big closeBtn" data-close="missions">닫기</button>
      </div>
    </div>
  </body>
</html>
