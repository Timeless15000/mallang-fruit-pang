;display:block}.up .pips i{width:10px}.up button{background:var(--gold);min-width:76px;height:38px;color:var(--ink);border-radius:12px;justify-content:center;align-items:center;gap:4px;font-size:14px;font-weight:800;display:flex;box-shadow:0 3px #d9801a}.up button.no{color:var(--muted);box-shadow:none;background:#ffffff1a}.up button.max{color:var(--mint);box-shadow:none;background:0 0}.mission{background:#ffffff0d;border-radius:16px;margin-bottom:8px;padding:12px}.mission .t{justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;display:flex}.mission .rw{color:var(--gold);align-items:center;gap:4px;font-weight:800;display:inline-flex}.mission .track{margin-top:9px}.mission .track>div{background:linear-gradient(90deg, var(--mintD), var(--mint))}.mission small{text-align:right;color:var(--muted);margin-top:4px;font-size:11px;display:block}.mission.done{opacity:.6}#lvPop{left:14px;top:calc(var(--st) + 150px);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;z-index:9;border-radius:16px;align-items:center;gap:10px;padding:7px 14px 7px 7px;transition:opacity .2s,transform .25s cubic-bezier(.2,1.4,.4,1);display:flex;position:fixed;transform:translate(-24px)scale(.96)}#lvPop.show{opacity:1;transform:none}#lvPop .tile{background:var(--c);border-radius:11px;place-items:center;width:38px;height:38px;display:grid;box-shadow:inset 0 -3px #00000040}#lvPop .t{flex-direction:column;line-height:1.15;display:flex}#lvPop small{letter-spacing:.12em;color:#3ee8c5;font-size:10px;font-weight:800}#lvPop b{white-space:nowrap;font-size:14px;font-weight:800}#lvPop em{color:#ffc845;margin-left:2px;font-style:normal}

  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="topbar">
        <div id="hearts"></div>
        <div id="score">0</div>
        <div class="right"><div id="coins" class="pill"><i data-ic="coin"></i><span>0</span></div><button id="mute" class="iconBtn" aria-label="소리"></button></div>
      </div>
      <div id="meters">
        <div class="meter"><b id="lvl">1</b><div class="track xp"><div id="xpFill"></div></div></div>
        <div class="meter" id="feverRow"><span class="lab">FEVER</span><div class="track fv"><div id="feverFill"></div></div></div>
      </div>
      <div id="bossBar"><div class="bname"><i data-ic="skull"></i><span id="bossName">대왕 문어 UFO</span></div><div class="track boss"><div id="bossFill"></div><i style="left:33.3%"></i><i style="left:66.6%"></i></div></div>
      <div id="combo"><b>0</b><span>COMBO</span></div>
    </div>
    <button id="bombBtn" aria-label="메가 폭탄"><svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" class="bg"/><circle cx="32" cy="32" r="28" class="fg" id="bombRing"/></svg><i data-ic="bomb" data-size="30"></i><em id="bombPct">0%</em></button>
    <div id="banner"><b></b><small></small></div>
    <div id="toast"></div>
    <div id="lvPop"></div>
    <div id="vfx"></div>

    <div id="levelup" class="panel">
      <div class="lvHead"><span class="kicker">LEVEL UP</span><h3>강화를 하나 고르세요</h3></div>
      <div id="cards"></div>
    </div>
    <div id="revive" class="panel">
      <div class="card narrow center">
        <div class="bigIcon"><i data-ic="heart" data-size="56"></i></div>
        <h2>격추 직전!</h2>
        <p class="sub">한 판에 한 번, 무료로 부활할 수 있어요</p>
        <button id="reviveBtn" class="btn primary">부활하기 <span id="reviveT" class="count">4</span></button>
        <button id="giveUpBtn" class="btn ghost">그만하기</button>
      </div>
    </div>

    <div id="home" class="screen show">
      <div class="logoWrap">
        <div class="kicker">DESTRUCTION SQUAD</div>
        <h1 class="logo">와장창</h1>
        <div class="logoSub">대작전</div>
      </div>
      <div class="homeSpacer"></div>
      <div class="homeBottom">
        <div class="bestCard"><i data-ic="trophy" data-size="22"></i><span>최고 기록</span><b id="homeBest">0</b></div>
        <button id="startBtn" class="btn primary big">출격하기</button>
        <div class="row2">
          <button id="upBtn" class="btn ghost"><i data-ic="wrench" data-size="20"></i>강화</button>
          <button id="missionBtn" class="btn ghost"><i data-ic="target" data-size="20"></i>오늘의 미션<em id="missionBadge"></em></button>
        </div>
        <p class="how">드래그로 이동 · 자동 발사 · 레벨업마다 무기 선택</p>
        <div id="version"></div>
      </div>
    </div>

    <div id="over" class="screen">
      <div class="card">
        <div id="overTitle" class="kicker">GAME OVER</div>
        <div class="bigScore" id="overScore">0</div>
        <div id="overBest" class="sub"></div>
        <div id="overNear" class="near"></div>
        <div class="stats" id="overStats"></div>
        <div class="earn"><i data-ic="coin" data-size="20"></i><span id="overCoins">+0</span></div>
        <div id="overMissions"></div>
        <button id="againBtn" class="btn primary big">한 판 더</button>
        <div class="row2">
          <button id="overHome" class="btn ghost"><i data-ic="home" data-size="20"></i>홈</button>
          <button id="overUp" class="btn ghost"><i data-ic="wrench" data-size="20"></i>강화</button>
        </div>
      </div>
    </div>

    <div id="upgrades" class="panel">
      <div class="card">
        <div class="cardHead"><h2>강화</h2><div class="pill"><i data-ic="coin"></i><span id="upCoins">0</span></div></div>
        <p class="sub">모은 코인으로 영구 강화</p>
        <div id="upList"></div>
        <button class="btn ghost closeBtn" data-close="upgrades">닫기</button>
      </div>
    </div>
    <div id="missions" class="panel">
      <div class="card">
        <div class="cardHead"><h2>오늘의 미션</h2></div>
        <p class="sub">매일 자정에 새로운 미션이 열려요</p>
        <div id="missionList"></div>
        <button class="btn ghost closeBtn" data-close="missions">닫기</button>
      </div>
    </div>
  </body>
</html>
