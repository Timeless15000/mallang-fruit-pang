        <div id="score">0</div>
        <div id="bestLine"><i data-ic="trophy" data-size="14"></i><span>0</span></div>
      </div>
      <div class="hc"><div id="timer"><i data-ic="clock" data-size="18"></i><span>1:00</span></div></div>
      <div class="hr">
        <div id="lives"><i></i><i></i><i></i></div>
        <button id="pauseBtn" class="iconBtn" aria-label="일시정지"><i data-ic="pause" data-size="20"></i></button>
      </div>
      <div id="bonusRow"></div>
    </div>
    <div id="toast"></div>

    <div id="home" class="screen show">
      <div class="homeTop">
        <div class="pill" id="homeCoins"><i data-ic="coin" data-size="20"></i><span>0</span></div>
        <button id="muteBtn" class="iconBtn" aria-label="소리"></button>
      </div>
      <div class="logoWrap">
        <div class="kicker">OFFICE SLASH</div>
        <h1 class="logo">칼퇴<span>의</span> 신</h1>
        <div class="logoSub">썰어야 퇴근한다</div>
        <div id="homeTip"></div>
      </div>
      <div class="modes">
        <button class="mode" data-mode="classic"><div class="mt"><i data-ic="x" data-size="22" style="color:#ff5a5f"></i><b>클래식</b></div><small>놓치면 경고 3번 · 빨간 건 절대 금지</small><em>최고 <span data-best="classic">0</span></em></button>
        <button class="mode" data-mode="arcade"><div class="mt"><i data-ic="clock" data-size="22"></i><b>아케이드</b></div><small>60초 · 칼퇴근 · 월급날 · 점심시간</small><em>최고 <span data-best="arcade">0</span></em></button>
        <button class="mode" data-mode="zen"><div class="mt"><i data-ic="leaf" data-size="22"></i><b>젠</b></div><small>90초 · 부장님 없음 · 힐링</small><em>최고 <span data-best="zen">0</span></em></button>
      </div>
      <div class="homeBtns">
        <button class="btn ghost" id="shopBtn"><i data-ic="blade" data-size="22"></i>칼 · 배경</button>
        <button class="btn ghost" id="missionBtn"><i data-ic="target" data-size="22"></i>오늘의 업무<em id="missionBadge"></em></button>
      </div>
      <div class="hint">빈 곳을 쓱 그어서 연습해 보세요</div>
      <div id="version"></div>
    </div>

    <div id="pause" class="screen dim">
      <div class="card">
        <div class="kicker">잠시 자리 비움</div>
        <h2>일시정지</h2>
        <button class="btn primary" id="resumeBtn"><i data-ic="play" data-size="22"></i>계속하기</button>
        <div class="row2"><button class="btn ghost" id="pRetry"><i data-ic="retry" data-size="20"></i>다시</button><button class="btn ghost" id="pHome"><i data-ic="home" data-size="20"></i>홈</button></div>
      </div>
    </div>

    <div id="over" class="screen dim">
      <div class="card over">
        <div class="kicker" id="overKicker">GAME OVER</div>
        <h2 id="overTitle">야근 당첨!</h2>
        <p id="overLine"></p>
        <div id="overScore">0</div>
        <div id="overBest"></div>
        <div class="rank"><div class="rankBadge" id="rankBadge">대리</div><div class="rankInfo"><b id="rankName"></b><div class="track"><div id="rankFill"></div></div><small id="rankNext"></small></div></div>
        <div class="earn"><i data-ic="coin" data-size="20"></i><b id="overCoins">+0</b></div>
        <div id="overMissions"></div>
        <button class="btn primary big" id="againBtn"><i data-ic="retry" data-size="22"></i>바로 다시</button>
        <div class="row2"><button class="btn ghost" id="shareBtn"><i data-ic="share" data-size="20"></i>자랑하기</button><button class="btn ghost" id="overHome"><i data-ic="home" data-size="20"></i>홈</button></div>
      </div>
    </div>

    <div id="shop" class="screen dim panel">
      <div class="card tall">
        <div class="phead"><h2>칼 · 배경</h2><div class="pill"><i data-ic="coin" data-size="18"></i><span id="shopCoins">0</span></div><button class="iconBtn closeBtn" aria-label="닫기"><i data-ic="close" data-size="20"></i></button></div>
        <div class="tabs"><button class="tab on" data-tab="blade">칼</button><button class="tab" data-tab="bg">배경</button></div>
        <div id="shopList"></div>
      </div>
    </div>

    <div id="missions" class="screen dim panel">
      <div class="card">
        <div class="phead"><h2>오늘의 업무</h2><button class="iconBtn closeBtn" aria-label="닫기"><i data-ic="close" data-size="20"></i></button></div>
        <p class="sub">매일 자정에 새 업무가 배정됩니다</p>
        <div id="missionList"></div>
      </div>
    </div>
  </body>
</html>
