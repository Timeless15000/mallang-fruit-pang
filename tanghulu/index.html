  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <button id="mute" class="icon" aria-label="소리">🔊</button>
        <div class="mid">
          <div id="score">0</div>
          <div id="floor">0층</div>
        </div>
        <div id="coins" class="pill">🪙 <span>0</span></div>
      </div>
      <div id="feverBar"><div></div><span>🔥 피버 타임 x2</span></div>
      <div id="combo"></div>
    </div>
    <div id="toast"></div>

    <div id="home" class="screen show">
      <div class="logo"><span class="l1">탕후루</span><span class="l2">타워</span></div>
      <p class="pitch">흔들리는 탕후루를 <b>딱!</b> 맞춰 하늘까지 쌓아라</p>
      <p class="bestline">최고 기록 <b id="homeBest">0</b>점</p>
      <div class="tapHint">👆 화면을 탭해서 시작</div>
      <div class="homeBtns">
        <button id="shopBtn" class="chip">🛍️ 간식 가게</button>
        <button id="missionBtn" class="chip">🎯 오늘의 미션 <i id="missionBadge"></i></button>
      </div>
    </div>

    <div id="over" class="screen">
      <div class="card">
        <div id="overTitle" class="overTitle">와르르!</div>
        <div class="bigScore" id="overScore">0</div>
        <div id="overBest" class="sub"></div>
        <div id="overNear" class="near"></div>
        <div class="earn"><span id="overCoins">+0</span> 🪙 <small id="overStats"></small></div>
        <div id="overMissions"></div>
        <button id="againBtn" class="big">다시 하기</button>
        <div class="row">
          <button id="overHome" class="chip">🏠 홈</button>
          <button id="overShop" class="chip">🛍️ 가게</button>
        </div>
        <div class="tapHint small">아무 곳이나 탭해도 바로 다시 시작!</div>
      </div>
    </div>

    <div id="shop" class="panel">
      <div class="card wide">
        <h2>🛍️ 간식 가게</h2>
        <p class="sub">코인으로 새로운 간식을 열어 보세요! <b class="pill small">🪙 <span id="shopCoins">0</span></b></p>
        <div id="skinGrid"></div>
        <button class="big closeBtn" data-close="shop">닫기</button>
      </div>
    </div>

    <div id="missions" class="panel">
      <div class="card wide">
        <h2>🎯 오늘의 미션</h2>
        <p class="sub">매일 자정에 새로운 미션이 열려요</p>
        <div id="missionList"></div>
        <button class="big closeBtn" data-close="missions">닫기</button>
      </div>
    </div>
  </body>
</html>
