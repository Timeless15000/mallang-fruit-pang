<body>
<canvas id="c"></canvas>
<div id="vig"></div><div id="flash"></div>
<div id="ui">
  <section id="home" class="screen show">
    <div class="topbar"><div class="money"><span class="lbl">퇴직금</span><b id="hMoney">₩0</b></div><button id="snd" class="icon-btn" aria-label="소리"></button></div>
    <div class="title-wrap">
      <div class="kicker">D-1 · 18:00 퇴근 직전</div>
      <h1>퇴사 전날</h1>
      <p class="tag">어차피 내일 안 나온다.<br/>60초 안에 회사를 부숴라.</p>
    </div>
    <div class="stages" id="stages"></div>
    <div class="home-actions">
      <button id="play" class="btn primary"><span>출근</span><small id="playSub">사무실</small></button>
      <button id="armBtn" class="btn ghost"><span>무기고</span><small id="armSub">맨주먹</small></button>
    </div>
    <div class="ver" id="ver"></div>
  </section>
  <section id="armory" class="screen">
    <div class="panel-head"><button class="back icon-btn" data-go="home" aria-label="뒤로"></button><h2>무기고</h2><div class="money"><span class="lbl">퇴직금</span><b id="aMoney">₩0</b></div></div>
    <div id="wlist" class="wlist"></div>
  </section>
  <section id="hud" class="screen">
    <div class="hud-top">
      <div class="timer"><span class="lbl">퇴근까지</span><b id="time">60</b></div>
      <div class="dmg"><span class="lbl">피해액</span><b id="dmg">₩0</b></div>
      <button id="pauseBtn" class="icon-btn small" aria-label="일시정지"></button>
    </div>
    <div class="meter"><div class="bar"><i id="pctBar"></i></div><span id="pct">파괴율 0%</span></div>
    <div id="combo" class="combo"><b id="comboX">×1.0</b><span id="comboN">연속 0</span></div>
    <div id="toast" class="toast"></div>
    <div id="banner" class="banner"><b id="banT"></b><span id="banS"></span></div>
    <div id="floats"></div>
    <div id="wbar" class="wbar"></div>
  </section>
  <section id="pause" class="screen modal">
    <div class="card"><h2>잠깐 숨 고르기</h2><p class="muted">CCTV는 아직 안 봤다.</p>
      <button id="resume" class="btn primary"><span>계속 부수기</span></button><button id="quit" class="btn ghost"><span>그만두고 나가기</span></button></div>
  </section>
  <section id="result" class="screen modal">
    <div class="card result">
      <div class="kicker">18:00 퇴근 완료</div>
      <h2 id="rGrade">시원한 퇴사</h2><p class="muted" id="rLine"></p>
      <div class="big-dmg"><span class="lbl">총 피해액</span><b id="rDmg">₩0</b><em id="rNew">신기록</em></div>
      <div class="stats">
        <div><span>파괴율</span><b id="rPct">0%</b></div><div><span>부순 물건</span><b id="rCnt">0</b></div>
        <div><span>최대 연속</span><b id="rCombo">0</b></div><div><span>가장 비싼 파괴</span><b id="rTop">-</b></div>
      </div>
      <div class="earn">퇴직금 <b id="rEarn">+₩0</b></div>
      <button id="again" class="btn primary"><span>다시 출근</span><small>바로 시작</small></button>
      <button id="toHome" class="btn ghost"><span>나가기</span></button>
    </div>
  </section>
</div>

</html>
